name: Build signed Ahla Tounsa Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified APK to the stable download release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ahla-tounsa-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v6

      - name: Require permanent signing credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Prepare private release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/ahla-tounsa-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify signed APK identity and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='tn.ahlatounsa.app'" <<< "$BADGING"
          grep -F "versionCode='2' versionName='1.1'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p dist
          cp "$APK" dist/ahla-tounsa.apk
          sha256sum dist/ahla-tounsa.apk | tee dist/SHA256SUMS.txt
          echo "Verified APK size: $(stat -c%s dist/ahla-tounsa.apk) bytes"

      - name: Keep verified APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ahla-tounsa-signed-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v6
        with:
          name: ahla-tounsa-signed-release-apk
          path: dist/

      - name: Publish stable signed release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: android-latest
          name: Ahla Tounsa Android 1.1
          target_commitish: main
          files: |
            dist/ahla-tounsa.apk
            dist/SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
