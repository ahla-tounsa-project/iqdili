name: Staging trusted proxy IP gateway test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-trusted-ip-gateway-test
  cancel-in-progress: false

jobs:
  gateway-spoof-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: iaksqnyglraoybavydmb
      PROBE_NAME: trusted-ip-probe
    steps:
      - name: Validate staging-only configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "iaksqnyglraoybavydmb"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$STAGING_PUBLISHABLE_KEY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure probe name is unused in Staging
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          deployed="$(supabase functions list --project-ref "$PROJECT_REF")"
          if grep -Fq "$PROBE_NAME" <<< "$deployed"; then
            echo "::error::Refusing to overwrite an existing staging function named $PROBE_NAME."
            exit 1
          fi

      - name: Create isolated probe source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trusted-ip-probe/supabase/functions/trusted-ip-probe
          cat > /tmp/trusted-ip-probe/supabase/config.toml <<'EOF'
          project_id = "iaksqnyglraoybavydmb"

          [functions.trusted-ip-probe]
          verify_jwt = false
          EOF
          cat > /tmp/trusted-ip-probe/supabase/functions/trusted-ip-probe/index.ts <<'EOF'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";

          Deno.serve((req: Request) => {
            if (req.method !== "GET") {
              return new Response("Method not allowed", { status: 405 });
            }
            return Response.json({
              cf_connecting_ip: req.headers.get("cf-connecting-ip"),
              x_forwarded_for: req.headers.get("x-forwarded-for"),
              x_real_ip: req.headers.get("x-real-ip"),
            }, {
              headers: { "Cache-Control": "no-store" },
            });
          });
          EOF

      - name: Deploy probe to Staging only
        id: deploy
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "iaksqnyglraoybavydmb"
          supabase functions deploy "$PROBE_NAME" \
            --project-ref "$PROJECT_REF" --use-api --yes \
            --workdir /tmp/trusted-ip-probe

      - name: Test gateway header spoof resistance
        id: gateway-test
        shell: bash
        env:
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/${PROBE_NAME}"
          AUTH_ARGS=(
            -H "apikey: ${STAGING_PUBLISHABLE_KEY}"
            -H "Accept: application/json"
          )

          baseline_status="$(curl --silent --show-error --output /tmp/baseline.json --write-out '%{http_code}' "${AUTH_ARGS[@]}" "$URL")"
          if [[ "$baseline_status" != "200" ]]; then
            echo "::error::Baseline request failed with HTTP $baseline_status."
            cat /tmp/baseline.json
            exit 1
          fi
          baseline_cf="$(jq -r '.cf_connecting_ip // empty' /tmp/baseline.json)"
          if [[ -z "$baseline_cf" ]]; then
            echo "::error::INCONCLUSIVE: baseline response has no CF-Connecting-IP."
            exit 1
          fi

          forwarded_status="$(curl --silent --show-error --output /tmp/forwarded.json --write-out '%{http_code}' "${AUTH_ARGS[@]}" \
            -H "X-Forwarded-For: 198.51.100.77" \
            -H "X-Real-IP: 198.51.100.78" "$URL")"
          if [[ "$forwarded_status" != "200" ]]; then
            echo "::error::Forwarding-header-only request failed with HTTP $forwarded_status."
            cat /tmp/forwarded.json
            exit 1
          fi
          forwarded_cf="$(jq -r '.cf_connecting_ip // empty' /tmp/forwarded.json)"
          if [[ -z "$forwarded_cf" || "$forwarded_cf" != "$baseline_cf" ]]; then
            echo "::error::FAIL: X-Forwarded-For or X-Real-IP changed the gateway client IP."
            exit 1
          fi

          forged_status="$(curl --silent --show-error --output /tmp/forged-cf.json --write-out '%{http_code}' "${AUTH_ARGS[@]}" \
            -H "CF-Connecting-IP: 198.51.100.79" "$URL")"
          if [[ "$forged_status" != "403" ]] || ! grep -Fq "error code: 1000" /tmp/forged-cf.json; then
            echo "::error::INCONCLUSIVE: expected Cloudflare to reject the caller-supplied CF-Connecting-IP with HTTP 403 / error code 1000; received HTTP $forged_status."
            cat /tmp/forged-cf.json
            exit 1
          fi

          echo "PASS: baseline had a trusted client IP; X-Forwarded-For and X-Real-IP did not change it; Cloudflare rejected a caller-supplied CF-Connecting-IP."
          echo "No IP values or credentials are printed."

      - name: Always delete temporary probe
        if: always() && steps.deploy.outcome != 'skipped'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "iaksqnyglraoybavydmb"
          supabase functions delete "$PROBE_NAME" \
            --project-ref "$PROJECT_REF" --yes
